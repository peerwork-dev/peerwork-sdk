[package]
name = "peerwork-runtime"
version = "0.0.1"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
peerwork-core = { path = "../core" }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
thiserror = "2"
tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
