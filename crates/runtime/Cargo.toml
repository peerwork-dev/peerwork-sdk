[package]
name = "peerwork-runtime"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
aes-gcm = "0.10"
peerwork-core = { path = "../core" }
ed25519-dalek = { version = "2", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }
