[package]
name = "peerwork-core"
version = "0.0.1"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
hpke = { version = "0.14.1", default-features = false, features = ["nistp", "aes", "alloc", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

