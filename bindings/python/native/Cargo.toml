[package]
name = "peerwork-python-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Peerwork Python native binding"

[lib]
name = "_peerwork_native"
crate-type = ["cdylib"]

[dependencies]
peerwork-core = { path = "../../../crates/core" }
peerwork-runtime = { path = "../../../crates/runtime" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
