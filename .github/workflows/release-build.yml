name: Exact native release builder
on:
  workflow_call:
    inputs:
      replica:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  native:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-musl
            runner: ubuntu-24.04
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPLICA: ${{ inputs.replica }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Guard exact tag and replica before building
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          case "$RELEASE_REPLICA" in 1|2) ;; *) exit 1 ;; esac
          python tools/release/version.py check --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        with:
          toolchain: '1.89.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        with:
          node-version: '24.20.0'
      - name: Native Linux immutable container build
        if: ${{ startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: python tools/release/linux-build.py --target "$RELEASE_TARGET" --tag "$RELEASE_TAG"
      - name: Native macOS and Windows build
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: |
          python -m pip install maturin==1.15.0
          python tools/release/build.py --target "$RELEASE_TARGET" --tag "$RELEASE_TAG" --output ".release-ci/$RELEASE_TARGET"
      - name: Validate emitted SPDX with the pinned official schema
        shell: bash
        run: |
          python -m pip install jsonschema==4.25.1 attrs==25.3.0 jsonschema-specifications==2025.9.1 referencing==0.36.2 rpds-py==0.27.1 typing_extensions==4.15.0
          python tests/release-spdx-schema.py --schema third_party/release-spdx/spdx-schema.json --document ".release-ci/$RELEASE_TARGET/sbom.spdx.json" --output "$RUNNER_TEMP/spdx-validation.json"
      - name: Sign build provenance for every exact emitted subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-ci/${{ matrix.target }}/*
      - name: Sign source-dependency SBOM association
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            .release-ci/${{ matrix.target }}/*.whl
            .release-ci/${{ matrix.target }}/*.tgz
            .release-ci/${{ matrix.target }}/*.tar.gz
          sbom-path: .release-ci/${{ matrix.target }}/sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-unsigned-${{ inputs.replica }}-${{ matrix.target }}
          path: .release-ci/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
