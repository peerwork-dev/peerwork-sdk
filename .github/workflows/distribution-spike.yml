name: Experimental native distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test shared core and build native artifacts
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p peerwork-cli -p peerwork-node-native
          python -m pip install 'maturin==1.15.0'
          cd bindings/python
          maturin build --release --locked --out ../../dist/wheels
          cd ../..
          python tests/verify-typed-wheel.py dist/wheels/*.whl
      - name: Package Node binary and test local offline installs
        run: |
          target='${{ matrix.target }}'
          target_arch="${target#linux-}"
          test "$(node -p 'process.arch')" = "${target_arch%-gnu}"
          node bindings/node/scripts/package-platform.mjs "$target" target/release/libpeerwork_node_native.so dist
          npm pack ./bindings/node --pack-destination dist --offline
          npm pack "./dist/agent-sdk-$target" --pack-destination dist --offline
          mkdir -p dist/node-consumer
          printf '%s\n' '{"name":"peerwork-offline-consumer","version":"0.0.0","private":true}' > dist/node-consumer/package.json
          npm install --prefix dist/node-consumer --offline --ignore-scripts --no-audit --no-fund ./dist/peerwork-agent-sdk-0.0.1.tgz "./dist/peerwork-agent-sdk-$target-0.0.1.tgz"
          node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
          python -m venv /tmp/peerwork-wheel-consumer
          /tmp/peerwork-wheel-consumer/bin/pip install --no-index --no-deps dist/wheels/*.whl
          /tmp/peerwork-wheel-consumer/bin/python -c 'import peerwork; assert peerwork.version() == "0.0.1"; assert peerwork.capabilities()["version"] == "0.0.1"'
          python -m pip install 'mypy==1.18.2'
          python tests/verify-installed-python-types.py \
            --python /tmp/peerwork-wheel-consumer/bin/python --mypy "$(command -v mypy)"
          env -i PATH=/usr/bin:/bin ./target/release/peerwork version
          state_dir="$(cd "$RUNNER_TEMP" && pwd -P)/peerwork state Ω with spaces"
          mkdir -m 700 "$state_dir"
          python tests/installed-protected-identity-smoke.py \
            --python /tmp/peerwork-wheel-consumer/bin/python \
            --node "$(command -v node)" --node-consumer "$PWD/dist/node-consumer" \
            --cli "$PWD/target/release/peerwork" --state-dir "$state_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.target }}
          path: |
            target/release/peerwork
            dist/wheels/*.whl
            dist/agent-sdk-*/
            dist/peerwork-agent-sdk-*.tgz

  linux_gnu_2_28_x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and install on pinned native glibc 2.28 image
        shell: bash
        run: |
          image='quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae'
          docker run --rm -v "$PWD:/work/sdk" -w /work/sdk "$image" /bin/bash -euc '
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
            export PATH="/opt/rh/gcc-toolset-14/root/usr/bin:/opt/python/cp311-cp311/bin:$PATH"
            mkdir -p /tmp/peerwork-gnu-tools dist
            curl -fsSL --retry 3 https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init -o /tmp/peerwork-gnu-tools/rustup-init
            echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/peerwork-gnu-tools/rustup-init" | sha256sum -c -
            chmod 755 /tmp/peerwork-gnu-tools/rustup-init
            export RUSTUP_HOME=/tmp/peerwork-gnu-tools/rustup CARGO_HOME=/tmp/peerwork-gnu-tools/cargo
            /tmp/peerwork-gnu-tools/rustup-init -y --no-modify-path --default-toolchain 1.89.0 --profile minimal
            export PATH="$RUSTUP_HOME/toolchains/1.89.0-x86_64-unknown-linux-gnu/bin:$PATH"
            export LD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.89.0-x86_64-unknown-linux-gnu/lib"
            test "$(rustc --version | cut -d " " -f 2)" = "1.89.0"
            curl -fsSL --retry 3 https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz -o /tmp/peerwork-gnu-tools/node.tar.xz
            echo "2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  /tmp/peerwork-gnu-tools/node.tar.xz" | sha256sum -c -
            mkdir -p /tmp/peerwork-gnu-tools/node
            tar --no-same-owner -xJf /tmp/peerwork-gnu-tools/node.tar.xz -C /tmp/peerwork-gnu-tools/node --strip-components=1
            export PATH="/tmp/peerwork-gnu-tools/node/bin:$PATH"
            test "$(node --version)" = "v24.20.0"
            cargo test --locked -p peerwork-core js_locale::tests::pinned_node_locale_compare_vectors -- --exact
            cargo build --release --locked -p peerwork-node-native -p peerwork-cli
            python -m pip install "maturin==1.15.0"
            (cd bindings/python && maturin build --release --locked --compatibility manylinux_2_28 --out ../../dist/wheels)
            python tests/verify-typed-wheel.py dist/wheels/*.whl
            node bindings/node/scripts/package-platform.mjs linux-x64-gnu target/release/libpeerwork_node_native.so dist
            npm pack ./bindings/node --pack-destination dist --offline
            npm pack ./dist/agent-sdk-linux-x64-gnu --pack-destination dist --offline
            mkdir -p dist/node-consumer
            printf "%s\n" "{\"name\":\"peerwork-offline-consumer\",\"version\":\"0.0.0\",\"private\":true}" > dist/node-consumer/package.json
            npm install --prefix dist/node-consumer --offline --ignore-scripts --no-audit --no-fund --no-save ./dist/peerwork-agent-sdk-0.0.1.tgz ./dist/peerwork-agent-sdk-linux-x64-gnu-0.0.1.tgz
            python -m pip install --no-index --no-deps --target dist/wheel-consumer dist/wheels/*.whl
            unset LD_LIBRARY_PATH
            env -i HOME=/tmp PATH=/tmp/peerwork-gnu-tools/node/bin:/usr/bin:/bin node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
            env -i HOME=/tmp PATH=/opt/python/cp311-cp311/bin:/usr/bin:/bin PYTHONPATH=/work/sdk/dist/wheel-consumer python -c "import peerwork; assert peerwork.version() == \"0.0.1\"; assert peerwork.capabilities()[\"verified_public_workspace_reads\"]"
            env -i HOME=/tmp PATH=/usr/bin:/bin target/release/peerwork version
            python -c "import glob,zipfile; zipfile.ZipFile(glob.glob(\"dist/wheels/*.whl\")[0]).extractall(\"dist/wheel-inspect\")"
            for binary in target/release/peerwork target/release/libpeerwork_node_native.so $(find dist/wheel-inspect -name "*.so"); do
              maximum=$(readelf --version-info "$binary" | grep -oE "GLIBC_[0-9.]+" | sort -Vu | tail -1)
              test "$(printf "%s\\n%s\\n" GLIBC_2.28 "$maximum" | sort -V | tail -1)" = GLIBC_2.28
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-x64-gnu-glibc2_28
          path: |
            target/release/peerwork
            dist/wheels/*.whl
            dist/agent-sdk-linux-x64-gnu/
            dist/peerwork-agent-sdk-0.0.1.tgz
            dist/peerwork-agent-sdk-linux-x64-gnu-0.0.1.tgz

  linux_musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-musl
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
            rootfs_sha256: 27694aaa55fd7a9e3ef596e0ad4eb66802308bb20172b17030cd5f4d8ae9bac2
            rustup_sha256: 331228566cc931f32cd684f9bebc5956a5e5d7394c8d5de595f196a658ab98e6
          - runner: ubuntu-24.04-arm
            target: linux-arm64-musl
            arch: aarch64
            rust_target: aarch64-unknown-linux-musl
            rootfs_sha256: 821565fa8f3953eefd12497b166b4b50add2f7c57fb312e75862f5867e06fefe
            rustup_sha256: 1ddf36182ac5d1782dbeefcb9bea7f5f9412d88f4a0d5047b1564a223624e8c6
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Alpine and Rust bootstrap inputs
        shell: bash
        run: |
          mkdir -p dist
          curl -fL --retry 3 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/${{ matrix.arch }}/alpine-minirootfs-3.22.6-${{ matrix.arch }}.tar.gz -o dist/alpine-minirootfs.tar.gz
          echo '${{ matrix.rootfs_sha256 }}  dist/alpine-minirootfs.tar.gz' | sha256sum -c -
          curl -fL --retry 3 https://static.rust-lang.org/rustup/dist/${{ matrix.rust_target }}/rustup-init -o dist/rustup-init
          echo '${{ matrix.rustup_sha256 }}  dist/rustup-init' | sha256sum -c -
          chmod 755 dist/rustup-init
          docker import dist/alpine-minirootfs.tar.gz peerwork-alpine:3.22.6-${{ matrix.arch }}
      - name: Build and install native musllinux interfaces
        shell: bash
        run: |
          docker run --rm -e PEERWORK_MUSL_RUST_TARGET="${{ matrix.rust_target }}" -e PEERWORK_NODE_PLATFORM_TARGET="${{ matrix.target }}" -v "$PWD:/work/sdk" -w /work/sdk peerwork-alpine:3.22.6-${{ matrix.arch }} /bin/sh -ec '
            apk add --no-cache build-base cmake perl python3 py3-pip nodejs npm git curl ca-certificates openssl-dev pkgconf binutils clang20 libc++ libc++-dev libc++-static llvm-libunwind-dev llvm-libunwind-static patchelf
            export RUSTUP_HOME=/tmp/peerwork-rustup CARGO_HOME=/tmp/peerwork-cargo
            /work/sdk/dist/rustup-init -y --no-modify-path --default-toolchain 1.89.0 --profile minimal
            export PATH="$RUSTUP_HOME/toolchains/1.89.0-$PEERWORK_MUSL_RUST_TARGET/bin:$PATH"
            export RUSTC="$RUSTUP_HOME/toolchains/1.89.0-$PEERWORK_MUSL_RUST_TARGET/bin/rustc"
            export RUSTDOC="$RUSTUP_HOME/toolchains/1.89.0-$PEERWORK_MUSL_RUST_TARGET/bin/rustdoc"
            export LD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.89.0-$PEERWORK_MUSL_RUST_TARGET/lib"
            export CARGO_TARGET_DIR=/work/sdk/target/musl-shared
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo test --locked -p peerwork-core js_locale::tests::pinned_node_locale_compare_vectors -- --exact
            cargo build --release --locked -p peerwork-node-native
            python3 -m pip download --no-deps --dest /tmp/maturin maturin==1.15.0
            python3 -m pip install --no-deps --target /tmp/maturin-tools /tmp/maturin/maturin-1.15.0-*.whl
            cd bindings/python
            /tmp/maturin-tools/bin/maturin build --release --locked --compatibility musllinux_1_2 --interpreter python3 --out ../../dist/wheels
            cd ../..
            python3 tests/verify-typed-wheel.py dist/wheels/*.whl
            node_arch=${PEERWORK_NODE_PLATFORM_TARGET#linux-}
            test "$(node -p "process.arch")" = "${node_arch%-musl}"
            test "$(rustc -vV | sed -n "s/^host: //p")" = "$PEERWORK_MUSL_RUST_TARGET"
            PEERWORK_MUSL_CXX_LIB_DIR=/usr/lib node bindings/node/scripts/package-platform.mjs "$PEERWORK_NODE_PLATFORM_TARGET" target/musl-shared/release/libpeerwork_node_native.so dist
            npm pack ./bindings/node --pack-destination dist --offline
            npm pack ./dist/agent-sdk-$PEERWORK_NODE_PLATFORM_TARGET --pack-destination dist --offline
            mkdir -p dist/node-consumer
            printf "%s\n" "{\"name\":\"peerwork-offline-consumer\",\"version\":\"0.0.0\",\"private\":true}" > dist/node-consumer/package.json
            npm install --prefix dist/node-consumer --offline --ignore-scripts --no-audit --no-fund --omit=optional ./dist/peerwork-agent-sdk-0.0.1.tgz ./dist/peerwork-agent-sdk-$PEERWORK_NODE_PLATFORM_TARGET-0.0.1.tgz
            node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
            python3 -m pip install --no-deps --target dist/wheel-consumer dist/wheels/*.whl
            PYTHONPATH=dist/wheel-consumer python3 -c "import peerwork; assert peerwork.version() == \"0.0.1\""
            unset RUSTFLAGS
            export CARGO_TARGET_DIR=/work/sdk/target/musl-static
            export PEERWORK_MUSL_STATIC_CXX=1 PEERWORK_MUSL_CXX_LIB_DIR=/usr/lib
            cargo build --release --locked -p peerwork-cli
            if readelf -d target/musl-static/release/peerwork | grep -q NEEDED; then exit 1; fi
            if readelf -l target/musl-static/release/peerwork | grep -q INTERP; then exit 1; fi
            target/musl-static/release/peerwork version
          '
          ./target/musl-static/release/peerwork version
      - name: Inspect artifacts and consume in a clean runtime container
        shell: bash
        run: |
          docker run --rm -e PEERWORK_MUSL_ARCH="${{ matrix.arch }}" -e PEERWORK_NODE_PLATFORM_TARGET="${{ matrix.target }}" -v "$PWD:/work/sdk:ro" -w /work/sdk peerwork-alpine:3.22.6-${{ matrix.arch }} /bin/sh -ec '
            apk add --no-cache python3 py3-pip nodejs binutils
            test "$(uname -m)" = "$PEERWORK_MUSL_ARCH"
            test ! -e /usr/lib/libc++.so.1
            test ! -e /usr/lib/libc++abi.so.1
            test ! -e /usr/lib/libunwind.so.1
            unset LD_LIBRARY_PATH PYTHONPATH PYTHONHOME
            python3 -m venv --without-pip /tmp/peerwork-wheel-consumer
            site_packages=$(/tmp/peerwork-wheel-consumer/bin/python -I -c "import sysconfig; print(sysconfig.get_path(\"purelib\"))")
            python3 -m pip install --no-index --no-deps --target "$site_packages" dist/wheels/*.whl
            /tmp/peerwork-wheel-consumer/bin/python -I -c "import peerwork; assert peerwork.version() == \"0.0.1\"; assert peerwork.capabilities()[\"verified_public_workspace_reads\"]"
            node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
            target/musl-static/release/peerwork version
            python3 -c "import glob,zipfile; zipfile.ZipFile(glob.glob(\"dist/wheels/*.whl\")[0]).extractall(\"/tmp/wheel-inspect\")"
            for binary in target/musl-static/release/peerwork dist/agent-sdk-$PEERWORK_NODE_PLATFORM_TARGET/index.node $(find /tmp/wheel-inspect -name "*.so*"); do
              readelf -h "$binary"
              readelf -d "$binary"
            done
            if readelf -d target/musl-static/release/peerwork | grep -q NEEDED; then exit 1; fi
            if readelf -l target/musl-static/release/peerwork | grep -q INTERP; then exit 1; fi
            state_dir="/tmp/protected identity Ω with spaces"
            mkdir -m 700 "$state_dir"
            python3 tests/installed-protected-identity-smoke.py \
              --python /tmp/peerwork-wheel-consumer/bin/python \
              --node "$(command -v node)" --node-consumer "$PWD/dist/node-consumer" \
              --cli "$PWD/target/musl-static/release/peerwork" --state-dir "$state_dir"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.target }}
          path: |
            target/musl-static/release/peerwork
            dist/wheels/*.whl
            dist/agent-sdk-${{ matrix.target }}/
            dist/peerwork-agent-sdk-0.0.1.tgz
            dist/peerwork-agent-sdk-${{ matrix.target }}-0.0.1.tgz

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile and exercise native interfaces
        shell: bash
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p peerwork-cli -p peerwork-node-native
          python -m pip install 'maturin==1.15.0'
          cd bindings/python
          maturin build --release --locked --out ../../dist/wheels
          cd ../..
          python tests/verify-typed-wheel.py dist/wheels/*.whl
          target='${{ matrix.target }}'
          test "$(node -p 'process.arch')" = "${target#darwin-}"
          node bindings/node/scripts/package-platform.mjs "$target" target/release/libpeerwork_node_native.dylib dist
          npm pack ./bindings/node --pack-destination dist --offline
          npm pack "./dist/agent-sdk-$target" --pack-destination dist --offline
          mkdir -p dist/node-consumer
          printf '%s\n' '{"name":"peerwork-offline-consumer","version":"0.0.0","private":true}' > dist/node-consumer/package.json
          npm install --prefix dist/node-consumer --offline --ignore-scripts --no-audit --no-fund ./dist/peerwork-agent-sdk-0.0.1.tgz "./dist/peerwork-agent-sdk-$target-0.0.1.tgz"
          node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
          python -m venv /tmp/peerwork-wheel-consumer
          /tmp/peerwork-wheel-consumer/bin/pip install --no-index --no-deps dist/wheels/*.whl
          /tmp/peerwork-wheel-consumer/bin/python -c 'import peerwork; assert peerwork.version() == "0.0.1"; assert peerwork.capabilities()["version"] == "0.0.1"'
          python -m pip install 'mypy==1.18.2'
          python tests/verify-installed-python-types.py \
            --python /tmp/peerwork-wheel-consumer/bin/python --mypy "$(command -v mypy)"
          ./target/release/peerwork version
          state_dir="$(cd "$RUNNER_TEMP" && pwd -P)/peerwork state Ω with spaces"
          mkdir -m 700 "$state_dir"
          python tests/installed-protected-identity-smoke.py \
            --python /tmp/peerwork-wheel-consumer/bin/python \
            --node "$(command -v node)" --node-consumer "$PWD/dist/node-consumer" \
            --cli "$PWD/target/release/peerwork" --state-dir "$state_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.target }}
          path: |
            target/release/peerwork
            dist/wheels/*.whl
            dist/agent-sdk-*/
            dist/peerwork-agent-sdk-*.tgz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Windows native ICU collation without ICU_DATA
        shell: pwsh
        run: |
          Remove-Item Env:\ICU_DATA -ErrorAction SilentlyContinue
          $cargoLog = Join-Path $env:RUNNER_TEMP 'peerwork-windows-icu-cargo.log'
          & cargo test -vv -p peerwork-core --locked js_locale::tests::pinned_node_locale_compare_vectors -- --exact *> $cargoLog
          $testExit = $LASTEXITCODE

          if ($testExit -ne 0) {
            Write-Output 'Windows ICU link diagnostic: selected Cargo directives and unresolved symbols'
            Get-Content -LiteralPath $cargoLog | Select-String -Pattern 'cargo:rustc-link-(?:search|lib)=|error LNK(?:2019|1120):'

            $archiveSpecs = @(
              @{ Name = 'icudatapeerwork'; Project = 'stubdata' },
              @{ Name = 'icuucpeerwork'; Project = 'common' },
              @{ Name = 'icui18npeerwork'; Project = 'i18n' }
            )
            $expectedSymbols = 'udata_setFileAccess_78_peerwork|udata_setCommonData_78_peerwork|ucol_open_78_peerwork|ucol_strcoll_78_peerwork|ucol_close_78_peerwork'
            $buildRoots = Get-ChildItem -LiteralPath 'target/debug/build' -Directory -Filter 'peerwork-core-*' -ErrorAction SilentlyContinue
            $archives = @{}
            foreach ($spec in $archiveSpecs) {
              $archives[$spec.Name] = @()
              foreach ($buildRoot in $buildRoots) {
                $archivePath = Join-Path $buildRoot.FullName "out/source/icu/source/$($spec.Project)/x64/Release/$($spec.Name).lib"
                if (Test-Path -LiteralPath $archivePath) {
                  $archive = Get-Item -LiteralPath $archivePath
                  $archives[$spec.Name] += $archive.FullName
                  Write-Output "ICU_ARCHIVE_FOUND $($spec.Name).lib bytes=$($archive.Length)"
                }
              }
              if ($archives[$spec.Name].Count -eq 0) {
                Write-Output "ICU_ARCHIVE_MISSING $($spec.Name).lib"
              }
            }

            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $dumpbin = $null
            if (Test-Path -LiteralPath $vswhere) {
              $vsroot = & $vswhere -latest -property installationPath
              $dumpbin = Get-ChildItem -Path (Join-Path $vsroot 'VC/Tools/MSVC') -Recurse -File -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            }

            if ($dumpbin) {
              foreach ($spec in $archiveSpecs) {
                foreach ($archivePath in $archives[$spec.Name]) {
                  $matches = @(& $dumpbin /linkermember:1 $archivePath 2>&1 | Select-String -Pattern $expectedSymbols)
                  if ($matches.Count -eq 0) {
                    Write-Output "ICU_PUBLIC_SYMBOLS_NONE $($spec.Name).lib"
                  } else {
                    $matches | ForEach-Object { Write-Output $_.Line }
                  }
                }
              }
            } else {
              Write-Output 'ICU_DUMPBIN_UNAVAILABLE'
            }
          }

          exit $testExit
      - name: Compile and exercise native interfaces
        shell: pwsh
        run: |
          Remove-Item Env:\ICU_DATA -ErrorAction SilentlyContinue
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p peerwork-cli -p peerwork-node-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'maturin==1.15.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location bindings/python
          maturin build --release --locked --out ../../dist/wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          node bindings/node/scripts/package-platform.mjs win32-x64-msvc target/release/peerwork_node_native.dll dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack ./bindings/node --pack-destination dist --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack ./dist/agent-sdk-win32-x64-msvc --pack-destination dist --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/node-consumer | Out-Null
          Set-Content -Path dist/node-consumer/package.json -Value '{"name":"peerwork-offline-consumer","version":"0.0.0","private":true}'
          npm install --prefix dist/node-consumer --offline --ignore-scripts --no-audit --no-fund ./dist/peerwork-agent-sdk-0.0.1.tgz ./dist/peerwork-agent-sdk-win32-x64-msvc-0.0.1.tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node bindings/node/scripts/offline-smoke.mjs dist/node-consumer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv "$env:RUNNER_TEMP\peerwork-wheel-consumer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/wheels/*.whl | Select-Object -First 1).FullName
          python tests/verify-typed-wheel.py $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\peerwork-wheel-consumer\Scripts\pip.exe" install --no-index --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\peerwork-wheel-consumer\Scripts\python.exe" -c 'import peerwork; assert peerwork.version() == "0.0.1"; assert peerwork.capabilities()["version"] == "0.0.1"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'mypy==1.18.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mypy = (Get-Command mypy -ErrorAction Stop).Source
          python tests/verify-installed-python-types.py `
            --python "$env:RUNNER_TEMP\peerwork-wheel-consumer\Scripts\python.exe" `
            --mypy $mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/peerwork.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stateDir = Join-Path $env:RUNNER_TEMP 'peerwork state Ω with spaces'
          [void][System.IO.Directory]::CreateDirectory($stateDir)
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;$sid)")
          Set-Acl -LiteralPath $stateDir -AclObject $acl -ErrorAction Stop
          python tests/installed-protected-identity-smoke.py `
            --python "$env:RUNNER_TEMP\peerwork-wheel-consumer\Scripts\python.exe" `
            --node (Get-Command node).Source --node-consumer (Join-Path $PWD 'dist/node-consumer') `
            --cli (Join-Path $PWD 'target/release/peerwork.exe') --state-dir $stateDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect Windows artifact dependencies and Node Intl import isolation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vsroot = $vsroot.Trim()
          $dumpbin = (Get-ChildItem "$vsroot\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1).FullName
          if (-not $dumpbin) { throw 'MSVC dumpbin.exe not found' }
          $wheel = (Get-ChildItem dist/wheels/*.whl | Select-Object -First 1).FullName
          python -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall("dist/wheel-inspect")' $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @('target/release/peerwork.exe', 'dist/agent-sdk-win32-x64-msvc/index.node')
          $binaries += (Get-ChildItem dist/wheel-inspect -Recurse -Filter *.pyd).FullName
          if ($binaries.Count -ne 3) { throw "expected exe, addon, and pyd; found $($binaries.Count)" }
          foreach ($binary in $binaries) {
            $imports = & $dumpbin /dependents $binary
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed: $binary" }
            if ($imports -match '(?i)\bicu(?:uc|in|dt|i18n|data)[^\s]*\.dll\b') {
              throw "dynamic ICU dependency: $binary"
            }
          }
          node -e 'const before = new Intl.Collator("en-US").compare("a-1", "a_1"); require("./dist/node-consumer/node_modules/@peerwork/agent-sdk"); const after = new Intl.Collator("en-US").compare("a-1", "a_1"); if (before !== after) process.exit(1)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-x64
          path: |
            target/release/peerwork.exe
            dist/wheels/*.whl
            dist/agent-sdk-win32-x64-msvc/
            dist/peerwork-agent-sdk-*.tgz
