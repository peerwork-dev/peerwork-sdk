name: Native participant qualification

# Deliberate candidate qualification only. Source-backup branches do not run it;
# this workflow cannot trigger the legacy experimental SDK publisher.
on:
  workflow_dispatch:
  push:
    branches: [work/native-participant-qualification]

permissions:
  contents: read

concurrency:
  group: native-participant-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  linux:
    if: ${{ !contains(github.event.head_commit.message, '[native:win32-x64-msvc]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select glibc 2.28 build environment
        shell: bash
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          printf '%s\n' /opt/rh/gcc-toolset-14/root/usr/bin /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.89.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: participant-v1-linux-x64-gnu-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-${{ github.sha }}
          restore-keys: |
            participant-v1-linux-x64-gnu-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-
      - name: Build and exercise installed native process
        shell: bash
        run: |
          python tests/native-participant-build-contract.py
          python tools/release/qualify-participant.py --target linux-x64-gnu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: participant-candidate-linux-x64-gnu
          path: .participant-ci/linux-x64-gnu/
          if-no-files-found: error
          retention-days: 7
      # Keep compilation reusable after a test failure. A cache never skips
      # building, testing, installed-process checks or source-bound reporting.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Development may qualify one changed platform. A normal candidate
        # push or dispatch still selects all three release targets.
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[native:win32-x64-msvc]') && '[{"target":"win32-x64-msvc","runner":"windows-2022","rustflags":"-C target-feature=+crt-static"}]' || '[{"target":"darwin-arm64","runner":"macos-15","rustflags":""},{"target":"win32-x64-msvc","runner":"windows-2022","rustflags":"-C target-feature=+crt-static"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.89.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: participant-v2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-${{ github.sha }}
          restore-keys: |
            participant-v2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-
      - name: Build and exercise installed native process
        shell: bash
        run: |
          python tests/native-participant-build-contract.py
          python tools/release/qualify-participant.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: participant-candidate-${{ matrix.target }}
          path: .participant-ci/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
