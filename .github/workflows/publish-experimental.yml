name: Publish experimental SDK prerelease

on:
  workflow_run:
    workflows: ['Experimental native distribution']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful explicit main-branch native candidate run to promote
        required: true
        type: string
  repository_dispatch:
    types: [promote-experimental]

permissions:
  actions: read
  contents: read

concurrency:
  group: experimental-prerelease-${{ github.event.workflow_run.id || github.event.client_payload.source_run_id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  validate_source:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate successful native run and complete artifact set
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.client_payload.source_run_id || inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          run_path=$(gh api "repos/$GH_REPOSITORY/actions/workflows/$(jq -r .workflow_id "$RUNNER_TEMP/source-run.json")" --jq .path)
          gh api "repos/$GH_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          python tools/release/experimental-source.py \
            --run "$RUNNER_TEMP/source-run.json" \
            --artifacts "$RUNNER_TEMP/source-artifacts.json" \
            --repository "$GH_REPOSITORY" --run-id "$SOURCE_RUN_ID" \
            --workflow-path "$run_path" --github-output "$GITHUB_OUTPUT"

  publish_prerelease:
    needs: validate_source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate_source.outputs.source_sha }}
          persist-credentials: false
      - name: Check source version and derive unique experimental tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.validate_source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(python tools/release/version.py check --plain)
          tag="v${version}-experimental.${SOURCE_RUN_ID}"
          python - "$GH_REPOSITORY" "$tag" <<'PY'
          import os, sys, urllib.error, urllib.request
          repo, tag = sys.argv[1:]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/ref/tags/{tag}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              urllib.request.urlopen(req, timeout=20).close()
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(0)
              raise
          raise SystemExit("refusing existing experimental tag: " + tag)
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: experimental-*
          path: .experimental-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate_source.outputs.source_run_id }}
      - name: Package exact target artifacts and checksums
        env:
          SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.validate_source.outputs.source_run_id }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.experimental-input')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'experimental-release-assets'
          out.mkdir()
          names = [
              'experimental-darwin-arm64', 'experimental-darwin-x64',
              'experimental-linux-arm64-gnu', 'experimental-linux-arm64-musl',
              'experimental-linux-x64-gnu', 'experimental-linux-x64-gnu-glibc2_28',
              'experimental-linux-x64-musl', 'experimental-windows-x64',
          ]
          for name in names:
              folder = root / name
              if not folder.is_dir() or not any(p.is_file() for p in folder.rglob('*')):
                  raise SystemExit(f'missing or empty source artifact: {name}')
              with zipfile.ZipFile(out / f'{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(folder.rglob('*')):
                      if path.is_file():
                          member = zipfile.ZipInfo(path.relative_to(root).as_posix())
                          member.compress_type = zipfile.ZIP_DEFLATED
                          # upload-artifact does not preserve executable bits. Restore
                          # the Unix CLI mode in the release archive; other files are data.
                          is_cli = path.name == 'peerwork' and path.suffix == ''
                          mode = 0o100755 if is_cli else 0o100644
                          member.external_attr = mode << 16
                          archive.writestr(member, path.read_bytes())
          rows = []
          for path in sorted(out.glob('*.zip')):
              rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          (out / 'SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          (out / 'SOURCE.json').write_text(json.dumps({
              'version': os.environ['VERSION'], 'tag': os.environ['RELEASE_TAG'],
              'source_sha': os.environ['SOURCE_SHA'], 'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'artifact_count': len(names)}, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Create experimental prerelease from validated source run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.validate_source.outputs.source_run_id }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRAFT_RELEASE_ID: ${{ github.event.client_payload.draft_release_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DRAFT_RELEASE_ID" ]]; then
            python - "$GH_REPOSITORY" "$DRAFT_RELEASE_ID" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/experimental-release-assets" <<'PY'
          import glob, json, os, pathlib, re, sys, urllib.error, urllib.parse, urllib.request
          repo, release_id, tag, source_sha, assets_dir = sys.argv[1:]
          if not re.fullmatch(r"[0-9]+", release_id):
              raise SystemExit("invalid draft release ID")
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          base = f"https://api.github.com/repos/{repo}/releases/{release_id}"
          request = urllib.request.Request(base, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              release = json.load(response)
          if (str(release.get("id")) != release_id or release.get("tag_name") != tag or
              release.get("target_commitish") != source_sha or not release.get("draft") or
              not release.get("prerelease") or release.get("assets")):
              raise SystemExit("draft release identity/state mismatch; refusing upload")
          upload_base = release["upload_url"].split("{", 1)[0]
          for path in sorted(glob.glob(os.path.join(assets_dir, "*"))):
              name = os.path.basename(path)
              url = upload_base + "?name=" + urllib.parse.quote(name)
              upload_headers = dict(headers, **{"Content-Type": "application/octet-stream"})
              req = urllib.request.Request(url, data=pathlib.Path(path).read_bytes(),
                                          headers=upload_headers, method="POST")
              with urllib.request.urlopen(req, timeout=90) as response:
                  result = json.load(response)
              if result.get("name") != name or result.get("state") != "uploaded":
                  raise SystemExit("asset upload response mismatch: " + name)
              print(f"uploaded {name} ({result.get('size')} bytes)")
          PY
            exit 0
          fi
          python - "$GH_REPOSITORY" "$RELEASE_TAG" "$RUNNER_TEMP/existing-release.json" <<'PY'
          import json, os, pathlib, sys, urllib.error, urllib.request
          repo, tag, output = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              state = {"found": True, "release": data}
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              state = {"found": False}
          pathlib.Path(output).write_text(json.dumps(state), encoding="utf-8")
          PY
          if jq -e '.found == true' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" '
              .release.tag_name == $tag and .release.target_commitish == $sha and
              .release.draft == true and .release.prerelease == true and
              (.release.assets | length) == 0
            ' "$RUNNER_TEMP/existing-release.json" >/dev/null
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/experimental-release-assets/* \
              --repo "$GH_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/experimental-release-assets/* \
              --repo "$GH_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
              --title "Peerwork SDK $RELEASE_VERSION (experimental)" \
              --notes "Experimental SDK build from source commit $SOURCE_SHA, workflow run $SOURCE_RUN_ID. This prerelease contains the eight target artifacts from that successful run. It is not a stable release and does not publish to PyPI or npm."
          fi
