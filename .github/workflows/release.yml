name: Full platform release (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the complete verified candidate (select its exact tag ref)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}
jobs:
  unsigned_one:
    uses: ./.github/workflows/release-build.yml
    with:
      replica: '1'
  unsigned_two:
    uses: ./.github/workflows/release-build.yml
    with:
      replica: '2'
  compare_and_assemble:
    needs: [unsigned_one, unsigned_two]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-unsigned-*
          path: .release-download
      - name: Verify exact reusable builder/source provenance and unsigned byte equality
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/ci-verify.py --artifacts .release-download --output .release-unsigned --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-unsigned/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-unsigned-assembled
          path: .release-unsigned/**
          include-hidden-files: true
          if-no-files-found: error
  macos_sign:
    needs: compare_and_assemble
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-unsigned-assembled
          path: .release-unsigned
      - name: Configure protected Developer ID and Apple notarization credentials
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12" && test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID"
          umask 077
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"developer-id.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_P12"],validate=True))'
          keychain="$RUNNER_TEMP/peerwork-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials peerwork-release --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Verify unsigned provenance, sign, verify signatures and require accepted notarization
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
        run: python tools/release/macos-sign.py --unsigned .release-unsigned --target "$RELEASE_TARGET" --output .release-signed --identity "$DEVELOPER_ID" --notary-profile peerwork-release --keychain "$RUNNER_TEMP/peerwork-release.keychain-db" --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-signed/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-signed-${{ matrix.target }}
          path: .release-signed/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Delete temporary private signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/peerwork-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
  finalize:
    needs: [compare_and_assemble, macos_sign]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-unsigned-assembled
          path: .release-unsigned
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-signed-*
          path: .release-signed-inputs
      - name: Bind unchanged unsigned data and authenticated macOS signed outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/finalize.py --unsigned .release-unsigned --signed .release-signed-inputs --output .release-final --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release-final/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-final-candidate
          path: .release-final/**
          include-hidden-files: true
          if-no-files-found: error
  publish_github:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: finalize
    environment: release-github
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-final-candidate
          path: .release-final
      - name: Verify final subjects and publish the exact GitHub asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python tools/release/publication-inputs.py --directory .release-final --output .release-publish --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
          mapfile -d '' files < <(find .release-final -type f -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "Peerwork $RELEASE_TAG"
  publish_pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: finalize
    environment: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-final-candidate
          path: .release-final
      - name: Verify exact final source and prepare only seven wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/publication-inputs.py --directory .release-final --output .release-publish --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: .release-publish/pypi
          attestations: true
  publish_npm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: finalize
    environment: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-final-candidate
          path: .release-final
      - name: Verify final source and publish platforms before the wrapper using npm OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python tools/release/publication-inputs.py --directory .release-final --output .release-publish --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
          node -e 'const v=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || v[0]===11 && (v[1]<5 || v[1]===5 && v[2]<1)) process.exit(1)'
          python -c 'import json,pathlib,subprocess; p=pathlib.Path(".release-publish"); [subprocess.run(["npm","publish",str(p/"npm"/n),"--access","public","--provenance","--registry","https://registry.npmjs.org"],check=True) for n in json.loads((p/"publication-inputs.json").read_text())["node_packages"]]'
