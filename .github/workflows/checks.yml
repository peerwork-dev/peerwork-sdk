name: SDK checks

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'bindings/**'
      - 'examples/meta-protocols/**'
      - 'examples/research/**'
      - 'conformance/**'
      - 'third_party/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '!**/*.md'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'bindings/**'
      - 'examples/meta-protocols/**'
      - 'examples/research/**'
      - 'conformance/**'
      - 'third_party/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.89.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: checks-v1-${{ runner.os }}-${{ runner.arch }}-rust1.89.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-${{ github.sha }}
          restore-keys: |
            checks-v1-${{ runner.os }}-${{ runner.arch }}-rust1.89.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', 'third_party/**') }}-
      - name: Validate source and release controls
        run: |
          python tools/release/version.py check
          python tests/experimental-source.py
          python tests/release-workflows.py
          python -m compileall -q bindings/python/peerwork
          node --check bindings/node/index.cjs
      - name: Test composable protocols and durable example host
        run: |
          node --test --test-isolation=none tests/research/protocols.test.mjs tests/research/host.test.mjs
          node examples/research/delm/run.mjs --offline
          node examples/research/agensh/run.mjs --offline
      - name: Test shared core, runtime and native bindings
        run: cargo test --workspace --locked
